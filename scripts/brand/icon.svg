<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F86F6"/>
      <stop offset="1" stop-color="#0B4FC4"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#tile)"/>
  <!-- key handle: shaft + two bits, rotated 45deg out of the lens -->
  <g transform="rotate(45 54 54)" fill="#fff">
    <rect x="86" y="48" width="38" height="13" rx="6.5"/>
    <rect x="101" y="57" width="9" height="16" rx="3"/>
    <rect x="114" y="57" width="9" height="11" rx="3"/>
  </g>
  <!-- lens: white ring, dark glass, read/write/admin spectrum -->
  <circle cx="54" cy="54" r="33" fill="#0A2A66" stroke="#fff" stroke-width="11"/>
  <rect x="33" y="48" width="25" height="12" rx="6" fill="#5FD27F"/>
  <rect x="60" y="48" width="14" height="12" rx="6" fill="#FFC21A"/>
  <rect x="76" y="48" width="8" height="12" rx="4" fill="#FF6A5C"/>
</svg>
