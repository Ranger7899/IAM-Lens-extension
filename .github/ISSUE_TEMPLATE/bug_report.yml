name: Bug report
description: Something in IAM Lens is wrong or broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, do not use this form; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popup
        2. Search for ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IAM Lens version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and OS
      placeholder: "Chrome 140, macOS 15"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Popup
        - Side panel
        - Options page
        - Other
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
      description: Do not paste anything private, such as project IDs or tokens.
    validations:
      required: false
