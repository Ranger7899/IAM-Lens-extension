name: snapshot

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Build snapshot
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          # Project that has the IAM API enabled (billing/quota attribution).
          GCP_QUOTA_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: node scripts/build-snapshot.ts

      - name: Validate snapshot
        run: node scripts/build-snapshot.ts --check

      - id: commit
        name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): update roles snapshot $(node -p "require('./data/manifest.json').version")"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes."
          fi

      - name: Prepare Pages artifact
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp data/roles.snapshot.json data/manifest.json _site/

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
