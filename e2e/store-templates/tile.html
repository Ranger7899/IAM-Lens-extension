<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face{font-family:"Google Sans Flex";font-weight:100 1000;src:url(data:font/woff2;base64,{{FLEX}}) format("woff2")}
      *{box-sizing:border-box;margin:0}
      html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
      body{position:relative;background:#f0f5fe;color:#1b2e5d;font-family:"Google Sans Flex",sans-serif}
      .icon{position:absolute;left:{{PAD}}px;top:{{PAD}}px;width:{{ISZ}}px;height:{{ISZ}}px}
      .icon svg{width:100%;height:100%;border-radius:22%}
      .t{position:absolute;left:{{PAD}}px;bottom:{{PAD}}px;right:{{PAD}}px}
      h1{font-weight:500;font-size:{{HS}}px;line-height:1.05;letter-spacing:-.01em;font-variation-settings:"wght" 500}
      p{margin-top:{{PM}}px;font-size:{{PS}}px;line-height:1.3;color:#475569;font-weight:400}
      .bar{display:flex;gap:2px;margin-top:{{BM}}px;height:{{BH}}px;width:{{BW}}px}
      .bar i{border-radius:2px;display:block}
      {{EXTRA_CSS}}
    </style>
  </head>
  <body>
    <div class="icon">{{ICON}}</div>
    {{EXTRA_HTML}}
    <div class="t">
      <h1>{{TITLE}}</h1>
      <p>{{TAG}}</p>
      <div class="bar">
        <i style="flex: 6; background: #2a9a5d"></i><i style="flex: 3; background: #b36d00"></i
        ><i style="flex: 1.2; background: #d4483d"></i>
      </div>
    </div>
  </body>
</html>
