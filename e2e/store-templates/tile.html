<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face{font-family:"Google Sans Flex";font-weight:100 1000;src:url(data:font/woff2;base64,{{FLEX}}) format("woff2")}
      *{box-sizing:border-box;margin:0}
      html,body{width:{{W}}px;height:{{H}}px;overflow:hidden}
      body{position:relative;background:#f5f7fd;color:#14181f;font-family:"Google Sans Flex",sans-serif}
      .dots{position:absolute;inset:0;background-image:radial-gradient(circle,#aab6d3 1.2px,transparent 1.5px);background-size:{{PITCH}}px {{PITCH}}px;opacity:.6;-webkit-mask-image:radial-gradient(ellipse 80% 90% at 70% 40%,#000,transparent 80%)}
      .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
      .a{width:{{GL}}px;height:{{GL}}px;right:-{{GLH}}px;top:-{{GLH}}px;background:#9cc0ff}
      .b{width:{{GLS}}px;height:{{GLS}}px;left:30%;bottom:-{{GLS2}}px;background:#ffd98a}
      .icon{position:absolute;left:{{PAD}}px;top:{{PAD}}px;width:{{ISZ}}px;height:{{ISZ}}px;filter:drop-shadow(0 14px 24px rgba(10,60,180,.35))}
      .icon svg{width:100%;height:100%}
      .t{position:absolute;left:{{PAD}}px;bottom:{{PAD}}px;right:{{PAD}}px}
      h1{font-weight:780;font-size:{{HS}}px;line-height:1.02;letter-spacing:-.035em}
      p{margin-top:{{PM}}px;font-size:{{PS}}px;line-height:1.3;color:#4a5365;font-weight:450}
      .bar{display:flex;gap:4px;margin-top:{{BM}}px;height:{{BH}}px;width:{{BW}}px}
      .bar i{border-radius:99px;display:block}
      {{EXTRA_CSS}}
    </style>
  </head>
  <body>
    <div class="glow a"></div>
    <div class="glow b"></div>
    <div class="dots"></div>
    <div class="icon">{{ICON}}</div>
    {{EXTRA_HTML}}
    <div class="t">
      <h1>{{TITLE}}</h1>
      <p>{{TAG}}</p>
      <div class="bar">
        <i style="flex: 6; background: #1e8e3e"></i><i style="flex: 3; background: #f9ab00"></i
        ><i style="flex: 1.2; background: #d93025"></i>
      </div>
    </div>
  </body>
</html>
