<!doctype html>
<html lang="en" class="{{THEME}}">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Google Sans Flex';
        font-weight: 100 1000;
        src: url(data:font/woff2;base64,{{FLEX}}) format('woff2');
      }
      @font-face {
        font-family: 'Google Sans Code';
        font-weight: 100 900;
        src: url(data:font/woff2;base64,{{CODE}}) format('woff2');
      }
      /* Console tokens (docs/design.md), light and dark. Flat tonal layers, hairlines, no glow. */
      :root {
        --shell: #f0f5fe;
        --panel: #ffffff;
        --head: #e9eef6;
        --border: #b7c3e0;
        --line: #d3dbec;
        --active: #dbedfc;
        --ink: #1b2e5d;
        --ink2: #475569;
        --accent: #314f9b;
        --read: #17703f;
        --write: #8f5200;
        --admin: #b3261e;
        --read-bg: #dff2e6;
        --write-bg: #fbebcc;
        --admin-bg: #fce4e1;
        --win: 0 0 0 1px #b7c3e0, 0 24px 48px -24px rgba(27, 46, 93, 0.28);
      }
      .dark {
        --shell: #282c32;
        --panel: #353b43;
        --head: #414d5e;
        --border: #50638b;
        --line: #4a5568;
        --active: #2a3f5e;
        --ink: #f1f4f9;
        --ink2: #b9c0cc;
        --accent: #a8baff;
        --read: #7fd4a2;
        --write: #f0b865;
        --admin: #ffa59c;
        --read-bg: #2c4a3d;
        --write-bg: #54432a;
        --admin-bg: #5c3335;
        --win: 0 0 0 1px #50638b, 0 24px 48px -24px rgba(0, 0, 0, 0.6);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      body {
        background: var(--shell);
        color: var(--ink);
        font-family: 'Google Sans Flex', sans-serif;
        position: relative;
      }
      .text {
        position: absolute;
        left: 84px;
        top: 150px;
        width: 600px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 32px;
        padding: 0 14px 0 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
        font: 500 16px/1 'Google Sans Flex';
        color: var(--ink2);
      }
      .eyebrow i {
        font-style: normal;
        display: grid;
        place-items: center;
        min-width: 24px;
        height: 22px;
        border-radius: 3px;
        background: var(--active);
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      h1 {
        margin-top: 32px;
        font-weight: 500;
        font-size: 64px;
        line-height: 1.08;
        letter-spacing: -0.01em;
        font-variation-settings: 'wght' 500;
      }
      h1 em {
        font-style: normal;
        color: var(--accent);
      }
      .sub {
        margin-top: 24px;
        font-size: 22px;
        line-height: 1.45;
        color: var(--ink2);
        max-width: 480px;
        font-weight: 400;
      }
      .tok {
        margin-top: 36px;
        display: inline-flex;
        font:
          500 21px/1 'Google Sans Code',
          monospace;
        padding: 12px 16px;
        border-radius: 4px;
        background: var(--head);
        border: 1px solid var(--border);
      }
      .tok .s {
        color: var(--accent);
        font-weight: 650;
      }
      .tok .r {
        color: var(--ink2);
      }
      .tok .v {
        font-weight: 700;
      }
      .tok .v.read {
        color: var(--read);
      }
      .tok .v.write {
        color: var(--write);
      }
      .tok .v.admin {
        color: var(--admin);
      }
      .legend {
        margin-top: 28px;
        display: flex;
        gap: 10px;
        font-size: 15px;
        font-weight: 500;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 12px;
        border-radius: 4px;
      }
      .legend s {
        display: block;
        width: 18px;
        height: 6px;
        border-radius: 2px;
        background: currentColor;
      }
      .legend .lr {
        background: var(--read-bg);
        color: var(--read);
      }
      .legend .lw {
        background: var(--write-bg);
        color: var(--write);
      }
      .legend .la {
        background: var(--admin-bg);
        color: var(--admin);
      }
      .shot {
        position: absolute;
        border-radius: 20px 20px 0 0;
        overflow: hidden;
        box-shadow: var(--win);
        background: var(--panel);
      }
      .shot img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .panel {
        left: 798px;
        top: 60px;
        width: 400px;
        height: 740px;
      }
      .popup {
        left: 84px;
        top: 430px;
        width: 380px;
        height: 560px;
        border-radius: 20px;
      }
      .has-popup .text {
        top: 64px;
        width: 540px;
      }
      .has-popup h1 {
        font-size: 58px;
      }
      .has-popup .tok,
      .has-popup .legend {
        display: none;
      }
      .has-popup .sub {
        margin-top: 20px;
      }
      .has-popup .panel {
        left: 640px;
      }
      .has-popup .popup {
        left: 84px;
        top: 400px;
      }
      .pill-mark {
        position: absolute;
        right: 84px;
        top: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
        font-size: 16px;
        color: var(--ink2);
      }
      .pill-mark svg {
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body class="{{LAYOUT}}">
    <div class="text">
      <div class="eyebrow"><i>{{NUM}}</i>{{EYEBROW}}</div>
      <h1>{{HEADLINE}}</h1>
      <p class="sub">{{SUB}}</p>
      <div class="tok">{{TOKEN}}</div>
      <div class="legend">
        <span class="lr"><s></s>Read</span><span class="lw"><s></s>Write</span
        ><span class="la"><s></s>Admin</span>
      </div>
    </div>
    <div class="pill-mark">{{ICON}}IAM Lens</div>
    <div class="shot panel"><img src="{{PANEL}}" /></div>
    {{POPUPHTML}}
  </body>
</html>
